<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coaching Site Copy Admin</title>
  <style>
    :root{--bg:#09131d;--panel:#102132;--panel2:#0c1926;--line:rgba(226,180,96,.24);--text:#f7efe2;--muted:rgba(247,239,226,.68);--gold:#e7b766;--gold2:#ffd999;--blue:#7ba7c7;}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top left,rgba(231,183,102,.12),transparent 32%),linear-gradient(180deg,#07111b,#0b1723 42%,#08111b);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif} button,input,textarea{font:inherit} .app{min-height:100vh;display:grid;grid-template-columns:300px 440px minmax(0,1fr)} aside,.editor{background:rgba(16,33,50,.92);border-right:1px solid var(--line);overflow:auto}.nav,.editor{padding:16px}.preview{padding:16px;background:rgba(7,17,27,.72)} h1{font-size:18px;margin:0 0 8px;color:var(--gold2)} h2{font-size:15px;margin:18px 0 8px;color:var(--gold)} p{color:var(--muted);margin:0 0 12px}.item{width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.04);color:var(--text);padding:10px 12px;cursor:pointer;margin:0 0 8px}.item.active{background:rgba(231,183,102,.13);border-color:rgba(231,183,102,.45)} .row{display:flex;gap:8px;flex-wrap:wrap}.field{border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px;margin:0 0 10px;background:rgba(255,255,255,.035)} label{display:block;color:var(--gold2);font-size:12px;letter-spacing:.02em;margin-bottom:6px}.meta{font-size:11px;color:var(--muted);margin-bottom:8px;word-break:break-word} textarea,input{width:100%;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.22);color:var(--text);padding:10px 12px} textarea{min-height:86px;resize:vertical}.actions{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(16,33,50,.6),var(--panel));padding:12px 0 0;margin-top:12px} .primary{border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;background:linear-gradient(180deg,#ffe0a1,#d79b42);color:#1b1008}.secondary{border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.06);color:var(--text)} .danger{border-color:rgba(255,99,99,.35);color:#ffd1d1}.status{margin-top:10px;color:var(--muted);font-size:12px}.preview iframe{width:100%;height:calc(100vh - 34px);border:1px solid var(--line);border-radius:18px;background:white}.settings{display:grid;gap:8px}.small{font-size:12px}.search{margin:12px 0}@media(max-width:1150px){.app{grid-template-columns:1fr}.preview iframe{height:70vh} aside,.editor{border-right:0;border-bottom:1px solid var(--line)}}
  </style>
</head>
<body data-copy-admin-root>
<div class="app">
  <aside class="nav"><h1>Coaching Copy Admin</h1><p>Vector Pilot style: page list, editable copy fields, local drafts, live preview, export, and GitHub publish.</p><input class="search" id="search" placeholder="Search copy…" /><div id="pages"></div><h2>Publish settings</h2><div class="settings"><input id="owner" value="PueoPono" placeholder="GitHub owner"><input id="repo" value="paul-homepage" placeholder="Repo"><input id="branch" value="main" placeholder="Branch"><input id="token" type="password" placeholder="GitHub token: Contents read/write"></div><p class="small">Token is kept only in this browser tab. Publish commits <code>site-copy.json</code>; pages read it at runtime.</p></aside>
  <section class="editor"><h1 id="title">Loading…</h1><p id="hint"></p><div class="row"><button class="secondary" id="collapse">Changed only</button><button class="secondary" id="expand">Show all</button></div><div id="fields"></div><div class="actions"><div class="row"><button class="primary" id="save">Save local draft</button><button class="secondary" id="export">Export JSON</button><button class="secondary" id="copy">Copy JSON</button><button class="primary" id="publish">Publish to GitHub</button><button class="secondary danger" id="reset">Reset local</button></div><div class="status" id="status">Ready.</div></div></section>
  <main class="preview"><iframe id="preview" title="Site preview"></iframe></main>
</div>
<script>
const STORAGE_KEY='paul-coaching-site-copy-admin-draft'; let state,selectedPage,showChangedOnly=false,query='';
const $=id=>document.getElementById(id); const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function load(){const local=localStorage.getItem(STORAGE_KEY); state=local?JSON.parse(local):await (await fetch('/site-copy.json',{cache:'no-store'})).json(); selectedPage=Object.keys(state.pages)[0]; render();}
function page(){return state.pages[selectedPage]} function allEntries(){return Object.values(state.pages).flatMap(p=>p.entries||[])}
function visibleEntries(){let e=page().entries||[]; if(query) e=e.filter(x=>`${x.label} ${x.original} ${x.value}`.toLowerCase().includes(query.toLowerCase())); if(showChangedOnly) e=e.filter(x=>x.value!==x.original); return e;}
function renderPages(){ $('pages').innerHTML=Object.entries(state.pages).map(([key,p])=>`<button class="item ${key===selectedPage?'active':''}" data-page="${key}">${esc(p.label)}<br><span class="small">${(p.entries||[]).filter(e=>e.value!==e.original).length} changed / ${(p.entries||[]).length} fields</span></button>`).join(''); document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{selectedPage=b.dataset.page; render();});}
function renderFields(){const p=page(); $('title').textContent=p.label; $('hint').textContent=`Editing ${selectedPage}. Draft preview uses local changes before publishing.`; $('fields').innerHTML=visibleEntries().map(e=>`<div class="field"><label>${esc(e.label||e.id)}</label><div class="meta">${esc(e.kind)}${e.attribute?' · '+esc(e.attribute):''}${e.name?' · '+esc(e.name):''} · ${esc(e.id)}</div><textarea data-id="${esc(e.id)}">${esc(e.value??'')}</textarea><div class="meta">Original: ${esc((e.original||'').slice(0,240))}${(e.original||'').length>240?'…':''}</div></div>`).join('')||'<p>No fields match.</p>'; document.querySelectorAll('textarea[data-id]').forEach(t=>t.oninput=()=>{const ent=allEntries().find(e=>e.id===t.dataset.id); ent.value=t.value; state.updatedAt=new Date().toISOString(); localStorage.setItem(STORAGE_KEY,JSON.stringify(state,null,2)); renderPages(); refreshPreview(false);});}
function refreshPreview(reset=true){localStorage.setItem(STORAGE_KEY,JSON.stringify(state,null,2)); const src='/' + selectedPage + '?site-copy-draft=local&adminPreview=' + Date.now(); if(reset) $('preview').src=src; else {clearTimeout(window.__pvt); window.__pvt=setTimeout(()=>$('preview').src=src,350);}}
function render(){renderPages();renderFields();refreshPreview();}
function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
$('search').oninput=e=>{query=e.target.value;renderFields()}; $('collapse').onclick=()=>{showChangedOnly=true;renderFields()}; $('expand').onclick=()=>{showChangedOnly=false;renderFields()};
$('save').onclick=()=>{localStorage.setItem(STORAGE_KEY,JSON.stringify(state,null,2));$('status').textContent='Local draft saved.';refreshPreview();};
$('export').onclick=()=>download('site-copy.json',JSON.stringify(state,null,2)); $('copy').onclick=async()=>{await navigator.clipboard.writeText(JSON.stringify(state,null,2));$('status').textContent='JSON copied.'};
$('reset').onclick=()=>{if(confirm('Clear local draft and reload published copy?')){localStorage.removeItem(STORAGE_KEY);location.reload();}};
$('publish').onclick=async()=>{try{const owner=$('owner').value.trim(),repo=$('repo').value.trim(),branch=$('branch').value.trim(),token=$('token').value.trim(); if(!token){$('status').textContent='Add a GitHub token first.';return} $('status').textContent='Publishing site-copy.json…'; const path='site-copy.json'; const headers={Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json','Content-Type':'application/json'}; const current=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`,{headers}).then(r=>r.ok?r.json():null); const body={message:'Update coaching site copy from admin portal',branch,content:btoa(unescape(encodeURIComponent(JSON.stringify(state,null,2))))}; if(current?.sha) body.sha=current.sha; const res=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`,{method:'PUT',headers,body:JSON.stringify(body)}); const data=await res.json(); if(!res.ok) throw new Error(data.message||'Publish failed'); $('status').textContent=`Published ${data.commit?.sha?.slice(0,7)||''}. GitHub Pages will update shortly.`;}catch(err){$('status').textContent=err.message;}};
load().catch(err=>{$('title').textContent='Load failed';$('status').textContent=err.message;});
</script>
</body>
</html>
